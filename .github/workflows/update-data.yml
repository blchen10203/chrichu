name: Update data

on:
  workflow_dispatch:
  # Turn on at build-order step 5 (spec section 14).
  # New data changes the Daily for anyone who has not started it yet, so deploy near midnight US Eastern.
  # schedule:
  #   - cron: "0 5 * * 2" # Tuesdays 05:00 UTC

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python pipeline/build.py
      - name: Commit the new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data pipeline/report.txt
          git diff --cached --quiet || (git commit -m "Update fighter data" && git push)
