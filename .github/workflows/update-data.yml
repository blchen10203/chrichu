name: Update data

on:
  workflow_dispatch:
  # The source (Greco1899/scrape_ufc_stats) refreshes around 18:00 UTC, on Sundays and some weekdays,
  # so a daily run at 19:00 UTC picks up a card about an hour after it lands. A refresh mid-day rarely moves
  # the Daily (last week's changed none of the next 365): mostly a fighter who just fought gets new answers.
  schedule:
    - cron: "0 19 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python pipeline/build.py
      # Photos for fighters with no outline yet, such as ranked fighters the build just added. The cache keeps each
      # downloaded photo and each "no photo" mark between runs, so a day with no new fighter asks ufc.com nothing.
      - uses: actions/cache@v4
        with:
          path: pipeline/.image-cache
          key: image-cache-${{ github.run_id }}
          restore-keys: image-cache-
      - name: Add photos for new fighters
        continue-on-error: true # photos are extras: never hold back the fight data for them
        run: |
          python pipeline/images.py
          pip install pillow==13.0.0
          python pipeline/headshots.py
          # A new headshot turns on hasImage, which only the build writes.
          if [ -n "$(git status --porcelain -- web/public/img/fighters)" ]; then python pipeline/build.py; fi
      - name: Stop if the site data did not change
        id: changed
        # report.txt carries the build date, so only web/data and new headshots decide whether there is anything to ship.
        run: |
          if [ -n "$(git status --porcelain -- web/data web/public/img/fighters)" ]; then data=yes; else data=no; fi
          echo "data=$data" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.data == 'yes'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test the new data
        # A failure here stops the run before the commit, so the site keeps the old data.
        if: steps.changed.outputs.data == 'yes'
        working-directory: web
        run: |
          npm ci
          npm test
      - name: Commit the new data
        if: steps.changed.outputs.data == 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data web/public/img/fighters pipeline/report.txt pipeline/roster.csv
          git commit -m "Update fighter data"
          git push
      # After the fighter data, so a rankings page change fails the run without holding back that commit.
      # rankings.py only rewrites the file when the rankings change, so an unchanged run commits nothing.
      # Also after a failed fighter build (it writes nothing then): one bad day there must not freeze the rankings.
      - name: Update the UFC rankings
        if: ${{ !cancelled() }}
        run: |
          pip install -r pipeline/requirements.txt
          python pipeline/rankings.py
      - name: Commit the rankings
        if: ${{ !cancelled() }}
        run: |
          git add web/data/rankings.json
          if git diff --cached --quiet; then echo "Rankings unchanged."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update UFC rankings"
          git push
