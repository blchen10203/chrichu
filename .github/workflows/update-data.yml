name: Update data

on:
  workflow_dispatch:
  # Turn on at build-order step 5 (spec section 14):
  # schedule:
  #   - cron: "0 10 * * 2" # Tuesdays 10:00 UTC

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python pipeline/build.py
      # TODO: validate, then commit web/data to main only if validation passes (spec 11.3).
