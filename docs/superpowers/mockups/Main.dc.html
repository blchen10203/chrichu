<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Silhouette round, Daily</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#5B9BFF}a:hover{color:#8DB8FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F1115; color: #F2F3F5; font-family: Inter, system-ui, sans-serif; padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 16px">

  <div style="display: flex; justify-content: space-between; align-items: center">
    <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 1px">[GAME NAME]</div>
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 1px; color: #A0A6B2; border: 1px solid #2A2E38; border-radius: 999px; padding: 6px 12px">DAILY · ROUND 2 / 5</div>
  </div>

  <div style="display: flex; gap: 6px; align-items: center">
    <div style="flex-grow: 1; height: 6px; border-radius: 3px; background: #F2F3F5"></div>
    <div style="flex-grow: 1; height: 6px; border-radius: 3px; background: #FF5A5F"></div>
    <div style="flex-grow: 1; height: 6px; border-radius: 3px; background: #2A2E38"></div>
    <div style="flex-grow: 1; height: 6px; border-radius: 3px; background: #2A2E38"></div>
    <div style="flex-grow: 1; height: 6px; border-radius: 3px; background: #2A2E38"></div>
    <div style="font-size: 12px; color: #A0A6B2; margin-left: 6px">Score 86</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px">
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 1.5px; color: #FF5A5F">REACH</div>
    <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 32px; line-height: 1.05">How long is Jon Jones' reach?</h1>
  </div>

  <div style="flex-grow: 1; background: #181B22; border: 1px solid #2A2E38; border-radius: 16px; padding: 14px 9px; display: flex; flex-direction: column; align-items: center; justify-content: space-between">

    <div style="width: 100%; box-sizing: border-box; padding: 0 6px; display: flex; align-items: center; gap: 10px">
      <div style="width: 44px; height: 44px; border-radius: 50%; border: 1px dashed #5B9BFF; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #A0A6B2">photo</div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 15px; font-weight: 600">Israel Adesanya</div>
        <div style="font-size: 12px; color: #A0A6B2">Blue corner · reference</div>
      </div>
      <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px; color: #5B9BFF">80.0 in</div>
    </div>

    <svg width="320" height="120" viewBox="0 0 320 120" role="img" aria-label="Reference silhouette, arms out, 80 inch reach">
      <rect x="0" y="32" width="320" height="12" rx="6" fill="#5B9BFF"></rect>
      <circle cx="160" cy="14" r="12" fill="#5B9BFF"></circle>
      <rect x="140" y="30" width="40" height="50" rx="8" fill="#5B9BFF"></rect>
      <rect x="141" y="76" width="16" height="44" rx="6" fill="#5B9BFF"></rect>
      <rect x="163" y="76" width="16" height="44" rx="6" fill="#5B9BFF"></rect>
    </svg>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
      <div style="width: 352px; height: 10px; background: repeating-linear-gradient(90deg, #4A5060 0 1px, transparent 1px 16px)"></div>
      <div style="font-size: 11px; color: #A0A6B2">each tick = 4 in</div>
    </div>

    <svg width="352" height="120" viewBox="-14 0 352 120" role="img" aria-label="Your estimate silhouette with drag handles at both fingertips">
      <rect x="0" y="32" width="324" height="12" rx="6" fill="#FF5A5F"></rect>
      <circle cx="162" cy="14" r="12" fill="#FF5A5F"></circle>
      <rect x="142" y="30" width="40" height="50" rx="8" fill="#FF5A5F"></rect>
      <rect x="143" y="76" width="16" height="44" rx="6" fill="#FF5A5F"></rect>
      <rect x="165" y="76" width="16" height="44" rx="6" fill="#FF5A5F"></rect>
      <circle cx="0" cy="38" r="11" fill="#0F1115" stroke="#F2F3F5" stroke-width="2"></circle>
      <path d="M3 34 L-3 38 L3 42" fill="none" stroke="#F2F3F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
      <circle cx="324" cy="38" r="11" fill="#0F1115" stroke="#F2F3F5" stroke-width="2"></circle>
      <path d="M321 34 L327 38 L321 42" fill="none" stroke="#F2F3F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>

    <div style="width: 100%; box-sizing: border-box; padding: 0 6px; display: flex; align-items: center; gap: 10px">
      <div style="width: 44px; height: 44px; border-radius: 50%; border: 1px dashed #FF5A5F; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #A0A6B2">photo</div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 15px; font-weight: 600">Jon Jones</div>
        <div style="font-size: 12px; color: #A0A6B2">Red corner · your estimate</div>
      </div>
    </div>
  </div>

  <div style="display: flex; align-items: center; justify-content: center; gap: 20px">
    <button aria-label="Decrease by half an inch" style="width: 48px; height: 48px; border-radius: 50%; border: 1px solid #2A2E38; background: #181B22; color: #F2F3F5; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 9 H15" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
    </button>
    <div style="display: flex; flex-direction: column; align-items: center">
      <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 56px; line-height: 1; color: #FF5A5F">81.0 in</div>
      <div style="font-size: 12px; color: #A0A6B2">Drag the fingertips, or tap for 0.5 in</div>
    </div>
    <button aria-label="Increase by half an inch" style="width: 48px; height: 48px; border-radius: 50%; border: 1px solid #2A2E38; background: #181B22; color: #F2F3F5; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 9 H15 M9 3 V15" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
    </button>
  </div>

  <button style="height: 56px; border: 0; border-radius: 14px; background: #D92D35; color: #FFFFFF; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 24px; letter-spacing: 1px">LOCK IN</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
