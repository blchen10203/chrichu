<!doctype html>

</head>

<x-dc>
<helmet>

</style>
</helmet>

    <div style="font-size: 12px; font-weight: 600; letter-spacing: 1px; color: #A0A6B2; border: 1px solid #2A2E38; border-radius: 999px; padding: 6px 12px">DAILY · ROUND 2 / 5</div>
  </div>

  <div style="display: flex; gap: 6px; align-items: center">

    <div style="flex-grow: 1; height: 6px; border-radius: 3px; background: #2A2E38"></div>
    <div style="flex-grow: 1; height: 6px; border-radius: 3px; background: #2A2E38"></div>
    <div style="flex-grow: 1; height: 6px; border-radius: 3px; background: #2A2E38"></div>
    <div style="font-size: 12px; color: #A0A6B2; margin-left: 6px">Score 136</div>
  </div>

  <div style="display: flex; align-items: flex-end; justify-content: space-between">
    <div style="display: flex; flex-direction: column; gap: 4px">

      <div style="display: flex; align-items: baseline; gap: 6px">
        <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 96px; line-height: 0.9">50</div>
        <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 28px; color: #A0A6B2">/ 100</div>
      </div>
    </div>
    <div style="font-size: 14px; color: #A0A6B2; text-align: right; padding-bottom: 6px">Off by 3.5 in<br>too short</div>
  </div>

  <div style="flex-grow: 1; background: #181B22; border: 1px solid #2A2E38; border-radius: 16px; padding: 14px 9px; display: flex; flex-direction: column; align-items: center; justify-content: space-between">

    <div style="width: 100%; box-sizing: border-box; padding: 0 6px; display: flex; align-items: center; gap: 10px">
      <div style="width: 44px; height: 44px; border-radius: 50%; border: 1px dashed #5B9BFF; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #A0A6B2">photo</div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 15px; font-weight: 600">Israel Adesanya</div>
        <div style="font-size: 12px; color: #A0A6B2">Blue corner · reference</div>
      </div>
      <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px; color: #5B9BFF">80.0 in</div>
    </div>

    <svg width="320" height="120" viewBox="0 0 320 120" role="img" aria-label="Reference silhouette, 80 inch reach">
      <rect x="0" y="32" width="320" height="12" rx="6" fill="#5B9BFF"></rect>
      <circle cx="160" cy="14" r="12" fill="#5B9BFF"></circle>
      <rect x="140" y="30" width="40" height="50" rx="8" fill="#5B9BFF"></rect>
      <rect x="141" y="76" width="16" height="44" rx="6" fill="#5B9BFF"></rect>
      <rect x="163" y="76" width="16" height="44" rx="6" fill="#5B9BFF"></rect>
    </svg>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
      <div style="width: 352px; height: 10px; background: repeating-linear-gradient(90deg, #4A5060 0 1px, transparent 1px 16px)"></div>
      <div style="font-size: 11px; color: #A0A6B2">each tick = 4 in</div>
    </div>

    <svg width="346" height="120" viewBox="-4 0 346 120" role="img" aria-label="Your estimate in red inside the true reach shown as a white outline">
      <rect x="0" y="30" width="338" height="16" rx="8" fill="none" stroke="#F2F3F5" stroke-width="2" stroke-dasharray="5 4"></rect>
      <rect x="7" y="32" width="324" height="12" rx="6" fill="#FF5A5F"></rect>
      <circle cx="169" cy="14" r="12" fill="#FF5A5F"></circle>
      <rect x="149" y="30" width="40" height="50" rx="8" fill="#FF5A5F"></rect>
      <rect x="150" y="76" width="16" height="44" rx="6" fill="#FF5A5F"></rect>
      <rect x="172" y="76" width="16" height="44" rx="6" fill="#FF5A5F"></rect>
    </svg>

    <div style="width: 100%; box-sizing: border-box; padding: 0 6px; display: flex; gap: 8px">
      <div style="flex-grow: 1; flex-basis: 0; background: #0F1115; border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 12px; color: #A0A6B2">Your estimate</div>
        <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px; color: #FF5A5F">81.0 in</div>
      </div>
      <div style="flex-grow: 1; flex-basis: 0; background: #0F1115; border: 1px dashed #F2F3F5; border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 12px; color: #A0A6B2">Actual</div>
        <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px">84.5 in</div>
      </div>
    </div>
  </div>

  <button style="height: 56px; border: 0; border-radius: 14px; background: #D92D35; color: #FFFFFF; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 24px; letter-spacing: 1px; display: flex; align-items: center; justify-content: center; gap: 10px">
    NEXT ROUND
    <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10 H16 M11 5 L16 10 L11 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
  </button>
</div>
</x-dc>

</html>
